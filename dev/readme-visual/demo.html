<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenKeyNav README capture fixture</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #071b16;
      color: #f7f3e8;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 820px;
      height: 500px;
      margin: 0;
      overflow: hidden;
    }

    body {
      padding: 20px;
      background:
        radial-gradient(circle at 80% 0%, rgba(209, 174, 74, 0.16), transparent 34%),
        linear-gradient(145deg, #0b3026, #061914 74%);
    }

    .capture {
      height: 460px;
      padding: 18px;
      background: rgba(4, 23, 19, 0.82);
      border: 1px solid rgba(207, 228, 213, 0.25);
      border-radius: 20px;
      box-shadow: 0 22px 50px rgba(0, 0, 0, 0.34);
    }

    header,
    .task,
    .workspace,
    .result {
      display: flex;
      align-items: center;
    }

    header {
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .brand {
      display: flex;
      gap: 10px;
      align-items: center;
      font-size: 20px;
      font-weight: 850;
      letter-spacing: -0.02em;
    }

    .key-mark,
    kbd {
      display: inline-grid;
      place-items: center;
      min-width: 32px;
      min-height: 32px;
      color: #10271f;
      background: #f3df9a;
      border: 1px solid #fff2bd;
      border-radius: 8px;
      box-shadow: 0 3px 0 #a88325;
      font-family: inherit;
      font-weight: 900;
    }

    .enabled {
      padding: 7px 11px;
      color: #dff7e6;
      background: #174a39;
      border: 1px solid #388361;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 750;
    }

    .enabled::before {
      margin-right: 6px;
      color: #83dda6;
      content: "●";
    }

    .task {
      justify-content: space-between;
      padding: 12px 14px;
      margin-bottom: 14px;
      color: #18352b;
      background: #fff8df;
      border-radius: 12px;
    }

    .task span {
      color: #755f16;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .task strong { font-size: 17px; }

    .workspace {
      gap: 14px;
      align-items: stretch;
      height: 330px;
    }

    .targets {
      display: grid;
      flex: 1.25;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .target {
      display: flex;
      gap: 12px;
      align-items: center;
      min-height: 82px;
      padding: 12px;
      color: #effaf3;
      text-align: left;
      background: #123b31;
      border: 1px solid #35695a;
      border-radius: 12px;
      cursor: pointer;
    }

    .target:hover,
    .target:focus-visible {
      background: #1b5041;
      border-color: #e2c663;
      outline: 3px solid #f1d36b;
      outline-offset: 2px;
    }

    .target:last-child { grid-column: 1 / -1; }

    .orb {
      width: 24px;
      height: 24px;
      flex: 0 0 24px;
      background: var(--orb);
      border-radius: 50%;
      box-shadow: 0 0 16px var(--orb);
    }

    .target strong,
    .target small { display: block; }
    .target strong { font-size: 17px; }
    .target small { margin-top: 2px; color: #a9c8ba; font-size: 12px; }

    .result {
      position: relative;
      flex: 0.75;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
      text-align: center;
      background:
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        #071f1a;
      background-size: 26px 26px;
      border: 1px solid #31584d;
      border-radius: 14px;
    }

    .result-icon {
      display: grid;
      width: 86px;
      height: 86px;
      margin-bottom: 18px;
      place-items: center;
      color: #1c382d;
      background: #c9b45d;
      border: 8px solid #86783f;
      border-radius: 22px;
      box-shadow: inset 0 0 22px rgba(255, 247, 186, 0.34);
      font-size: 34px;
      font-weight: 950;
    }

    .result strong { font-size: 18px; }
    .result p { margin: 5px 18px 0; color: #a8c5b8; font-size: 13px; }

    body[data-complete="true"] .result {
      background-color: #11392e;
      border-color: #9ed56f;
      box-shadow: inset 0 0 54px rgba(213, 228, 104, 0.15);
    }

    body[data-complete="true"] .result-icon {
      color: #173227;
      background: #d9e56f;
      border-color: #87913d;
      box-shadow: 0 0 38px rgba(217, 229, 111, 0.65);
    }

    /* Compact, fixed geometry keeps all three storyboard panels comparable. */
    html,
    body {
      width: 520px;
      height: 420px;
    }

    body { padding: 14px; }

    .capture {
      height: 392px;
      padding: 14px;
      border-radius: 16px;
    }

    header { margin-bottom: 10px; }
    .brand { font-size: 17px; }

    .key-mark,
    kbd {
      min-width: 27px;
      min-height: 27px;
    }

    .enabled { font-size: 11px; }

    .task {
      padding: 8px 10px;
      margin-bottom: 10px;
    }

    .task strong { font-size: 13px; }

    .workspace {
      flex-direction: column;
      gap: 10px;
      height: 282px;
    }

    .targets {
      display: grid;
      flex: none;
      height: 198px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .target {
      min-height: 0;
      padding: 9px 11px;
    }

    .target:last-child { grid-column: auto; }
    .target strong { font-size: 15px; }
    .target small { font-size: 10px; }

    .orb {
      width: 18px;
      height: 18px;
      flex-basis: 18px;
    }

    .result {
      flex: none;
      flex-direction: row;
      justify-content: flex-start;
      height: 74px;
      padding: 10px 14px;
      text-align: left;
    }

    .result-icon {
      width: 48px;
      height: 48px;
      margin: 0 14px 0 0;
      border-width: 5px;
      border-radius: 13px;
      font-size: 22px;
    }

    .result strong { font-size: 15px; }
    .result p { margin: 3px 0 0; font-size: 11px; }
    .result-copy { min-width: 0; }

    .openKeyNav-label {
      min-width: 30px !important;
      padding: 5px 8px !important;
      font-size: 24px !important;
      font-weight: 900 !important;
      line-height: 1 !important;
    }
  </style>
</head>
<body>
  <main class="capture" aria-label="OpenKeyNav Click Mode capture fixture">
    <header>
      <div class="brand"><span class="key-mark">K</span> OpenKeyNav Click Mode</div>
      <div class="enabled">Shortcuts on</div>
    </header>

    <div class="task">
      <span>Your task</span>
      <strong>Choose Juniper without tabbing through every target.</strong>
    </div>

    <div class="workspace">
      <section class="targets" aria-label="Available targets">
        <button class="target" type="button" data-name="Pip">
          <span class="orb" style="--orb:#f4c95d"></span>
          <span><strong>Pip</strong><small>Amber spark</small></span>
        </button>
        <button class="target" type="button" data-name="Mica">
          <span class="orb" style="--orb:#72c5df"></span>
          <span><strong>Mica</strong><small>Blue shimmer</small></span>
        </button>
        <button class="target" type="button" data-name="Nova">
          <span class="orb" style="--orb:#b697e8"></span>
          <span><strong>Nova</strong><small>Violet pulse</small></span>
        </button>
        <button class="target" id="juniper" type="button" data-name="Juniper">
          <span class="orb" style="--orb:#d9e56f"></span>
          <span><strong>Juniper</strong><small>Green-gold glow</small></span>
        </button>
      </section>

      <section class="result" aria-live="polite">
        <div class="result-icon" aria-hidden="true">K</div>
        <div class="result-copy">
          <strong id="result-title">Waiting for a target</strong>
          <p id="result-copy">Press <kbd>K</kbd>, then type a displayed label.</p>
        </div>
      </section>
    </div>
  </main>

  <script src="../../dist/openkeynav.umd.min.js"></script>
  <script>
    const resultTitle = document.getElementById('result-title');
    const resultCopy = document.getElementById('result-copy');

    document.querySelectorAll('.target').forEach((target) => {
      target.addEventListener('click', () => {
        const name = target.dataset.name;
        document.body.dataset.complete = 'true';
        resultTitle.textContent = `${name} selected`;
        resultCopy.textContent = name === 'Juniper'
          ? 'The intended target was activated from its label.'
          : 'That target was activated from its label.';
      });
    });

    window.openKeyNav = new OpenKeyNav();
    window.openKeyNav.init({
      debug: {keyboardAccessible: false},
      notifications: {enabled: false},
      spot: {
        fontColor: '#10271f',
        backgroundColor: '#f3df9a',
        insetColor: '#10271f',
        fontSize: '24px',
        arrowSize_px: 7,
      },
    });
    window.openKeyNav.enable();
    document.documentElement.dataset.captureReady = 'true';
  </script>
</body>
</html>
