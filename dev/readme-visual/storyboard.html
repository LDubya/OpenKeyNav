<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenKeyNav Click Mode in three steps</title>
  <style>
    * { box-sizing: border-box; }

    html,
    body {
      width: 1500px;
      height: 610px;
      margin: 0;
      overflow: hidden;
    }

    body {
      padding: 28px 34px 32px;
      color: #f8f5ea;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 82% 8%, rgba(219, 183, 74, 0.18), transparent 31%),
        linear-gradient(140deg, #103b2e, #061a15 72%);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: end;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0;
      font-size: 42px;
      letter-spacing: -0.045em;
      line-height: 1;
    }

    header p {
      max-width: 610px;
      margin: 0;
      color: #b9d1c5;
      font-size: 21px;
      line-height: 1.35;
      text-align: right;
    }

    .steps {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
    }

    .step {
      overflow: hidden;
      background: #f8f6ef;
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 22px;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.26);
    }

    .step-heading {
      display: grid;
      grid-template-columns: 52px 1fr;
      gap: 14px;
      align-items: center;
      min-height: 106px;
      padding: 18px 20px;
      color: #12372b;
    }

    .number {
      display: grid;
      width: 52px;
      height: 52px;
      place-items: center;
      color: #17382d;
      background: #f1d368;
      border-radius: 50%;
      font-size: 23px;
      font-weight: 900;
    }

    h2 {
      margin: 0 0 5px;
      font-size: 28px;
      letter-spacing: -0.025em;
      line-height: 1;
    }

    .step-heading p {
      margin: 0;
      color: #587066;
      font-size: 20px;
      line-height: 1.3;
    }

    kbd {
      display: inline-block;
      min-width: 28px;
      padding: 2px 7px 3px;
      color: #19382e;
      background: #f4dfa0;
      border: 1px solid #c9aa42;
      border-radius: 6px;
      box-shadow: 0 2px 0 #a68627;
      font-family: inherit;
      font-weight: 850;
      text-align: center;
    }

    .frame {
      height: 350px;
      margin: 0 10px 10px;
      overflow: hidden;
      background: #071b16;
      border-radius: 15px;
    }

    .frame img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <header>
    <h1>Click Mode in three steps</h1>
    <p>OpenKeyNav reveals short labels beside detected targets, so users can choose one directly.</p>
  </header>

  <main class="steps">
    <section class="step">
      <div class="step-heading">
        <span class="number">1</span>
        <div><h2>Enable shortcuts</h2><p>Press <kbd>Shift</kbd> + <kbd>O</kbd> once.</p></div>
      </div>
      <div class="frame"><img src="captures/step-1.jpg" alt="OpenKeyNav capture fixture with shortcuts enabled"></div>
    </section>

    <section class="step">
      <div class="step-heading">
        <span class="number">2</span>
        <div><h2>Reveal target labels</h2><p>Press <kbd>K</kbd> to enter Click Mode.</p></div>
      </div>
      <div class="frame"><img src="captures/step-2.jpg" alt="Click Mode labels beside each available target"></div>
    </section>

    <section class="step">
      <div class="step-heading">
        <span class="number">3</span>
        <div><h2>Choose a target</h2><p>Type the label shown beside Juniper.</p></div>
      </div>
      <div class="frame"><img src="captures/step-3.jpg" alt="Juniper selected after typing its Click Mode label"></div>
    </section>
  </main>
</body>
</html>
